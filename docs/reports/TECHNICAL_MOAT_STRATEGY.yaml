gap_identified:
  description: >
    "Causality Gap" (Lacuna de Causalidade).
    O ABS V6.5 intercepta O QUE o agente fez (Tool Call), mas é cego sobre POR QUE ele fez (Prompt/Contexto).
    Para uma Seguradora (Insurtech Pivot), saber que "o agente deletou o banco" é insuficiente.
    É crítico provar se foi "Prompt Injection" (culpa do usuário), "Alucinação" (culpa do modelo) ou "Dados Corrompidos" (culpa do RAG).
    Sem essa distinção, a atribuição de responsabilidade (Liability) é impossível.
  evidence: >
    Arquivo `packages/mcp-proxy/src/interceptor.ts`.
    O interceptor analisa `line` (o payload JSON-RPC da ferramenta), mas não tem acesso ao `history` ou `context` do LLM que gerou o comando.
    A auditoria forense confirmou que operamos no "Output Stream", ignorando o "Input Stream".

proposed_capability:
  name: "Context Provenance Ledger (The Black Box)"
  what_it_is: >
    Um sistema de registro imutável que ancora criptograficamente os INPUTS (Prompts, RAG Chunks) aos OUTPUTS (Tool Calls).
    Funciona como a "Caixa Preta" de um avião: grava os "dados dos sensores" antes da "queda".
  mechanism:
    - components:
        - "Context Hasher (Middleware)": Intercepta o request para o LLM (antes da resposta).
        - "Provenance Merkle Tree": Cria uma árvore de hash contendo [Hash(SystemPrompt), Hash(UserPrompt), Hash(RAGChunks)].
        - "Simultaneous Signing": Quando o Sentinel assina o Tool Call (Output), ele anexa o `MerkleRoot` do Contexto (Input).
    - flow:
        1. Middleware captura Contexto -> Gera `ContextHash`.
        2. Agente gera Tool Call.
        3. Sentinel intercepta Tool Call.
        4. Sentinel anexa `ContextHash` ao `AuditEntry`.
        5. `ABSAuditSystem` assina [ToolCall + ContextHash].
  when_not_to_use: >
    Agentes de privacidade extrema onde o *conteúdo* do prompt não pode ser provado nem para auditores (embora Zero-Knowledge Proofs possam resolver isso no futuro, o MVP gravaria hashes).

moat_analysis:
  - "Por que não vira commodity?": >
    Gateways de API (Kong) não entendem a semântica de "Sessão LLM".
    Frameworks (LangChain) não têm estado soberano assinado.
    Isso une a camada de Aplicação (Contexto) com a camada de Rede (Sentinel) de forma criptográfica.
  - "Barreira de Entrada": >
    Exige instrumentação dupla (Input + Output) e sincronização de estado com baixa latência.
    Competidores focam apenas em "Guardrails de Saída". O ABS domina a "Cadeia de Custódia Completa".

mvp_plan_4_8_weeks:
  - "Semana 1-2": Criar `ContextHasher` middleware para interceptar requests OpenAI/Anthropic.
  - "Semana 3-4": Integrar `ContextHash` no `ABSAuditSystem` (Rust/WASM).
  - "Semana 5-6": Atualizar `Sentinel` para exigir `ContextHash` no handshake de validação.
  - "Semana 7-8": "Forensic Explorer Dashboard" - Visualizar a árvore de decisão de um incidente.

success_metrics:
  - "Attribution Rate": % de incidentes onde a causa raiz (Prompt vs Modelo) é identificada automaticamente.
  - "Insurance Readiness Score": Capacidade de gerar um "Sinistro Automático" aceito por uma seguradora (Mock).

risks:
  - "Privacy Leak": Hash de dados sensíveis pode ser suscetível a rainbow tables se a entropia for baixa.
  - "Latency OVerhead": Calcular Merkle Trees em tempo real pode adicionar latência inaceitável para HFT.

final_question: "E se usarmos Zero-Knowledge Proofs (ZK-SNARKs) para provar que o 'Prompt continha PII' sem revelar o PII, transformando o ABS na única plataforma de compliance GDPR-Proof para agentes?"
