id: ABS_INDISPENSABLE_GATE_V1
version: 1.0.0
language: pt-BR
owner: Rodrigo Gomes
authority: ABS_INSTITUTIONAL_GATEKEEPER
mode: ALL_OR_NOTHING
fail_closed: true
purpose: >
  Encerrar a fase "Indispensável": ABS deve provar buyability (evidência auditável),
  inevitabilidade externa (CI/Badge/Branch Protection), distribuição sem fricção,
  e maturidade de identidade (rotação/revogação de chaves).

non_negotiables:
  - no_path_hijack_or_global_shims: true
  - receipts_ed25519_offline_verifiable: true
  - fail_closed_on_missing_evidence: true
  - policies_versioned_and_pinned: true

targets:
  ttfv_seconds_max: 60
  buyer_report_command: "abs report"
  ci_template: "drop-in github action"
  key_lifecycle: "rotate + revoke"

gates:
  - id: G1_TTFV_BLOCK
    description: "Valor em 60s: gerar 1 bloqueio + receipt + verify offline."
    checks:
      - id: TTFV_01
        rule: "fresh_repo -> abs init -> abs run (deny demo) completes <= 60s"
        evidence: ["evidence/ttfv_timestamps.json"]
      - id: TTFV_02
        rule: "receipt generated and verified offline using only public key"
        evidence:
          [
            "receipts/deny_demo.json",
            "evidence/verify_offline_output.txt",
            "public_keys.json",
          ]

  - id: G2_BUYER_PROOF_REPORT
    description: "Relatório comprável (auditor-ready) em 1 comando."
    checks:
      - id: REPORT_01
        rule: "abs report --range 24h outputs md+json+csv"
        evidence:
          [
            "reports/audit_report.md",
            "reports/audit_report.json",
            "reports/audit_report.csv",
          ]
      - id: REPORT_02
        rule: "report includes: decision_counts, top_reason_codes, verification_summary, trace_ids"
        evidence: ["reports/audit_report.md"]

  - id: G3_EXTERNAL_INEVITABILITY
    description: "Time não consegue remover ABS sem quebrar CI."
    checks:
      - id: CI_01
        rule: "drop-in github action blocks PR when receipts missing/invalid"
        evidence: ["ci/action.yml", "evidence/ci_block_log.txt"]
      - id: CI_02
        rule: "branch protection guidance present + badge generator outputs ABS Protected"
        evidence: ["docs/BRANCH_PROTECTION.md", "evidence/badge_output.svg"]

  - id: G4_KEY_LIFECYCLE
    description: "Rotação e revogação de chaves para receipts."
    checks:
      - id: KEY_01
        rule: "supports key_id rollover with validity windows"
        evidence: ["docs/KEY_ROTATION.md", "public_keys.json"]
      - id: KEY_02
        rule: "revoked key receipts fail verification"
        evidence:
          [
            "receipts/revoked_key_sample.json",
            "evidence/verify_revoked_fail.txt",
          ]

  - id: G5_POLICY_REGISTRY_MIN
    description: "Marketplace mínimo de policies (assinadas + pinadas)."
    checks:
      - id: POL_01
        rule: "policy index is signed and bundles include policy+schema+tests"
        evidence:
          [
            "docs/policies/index.json",
            "docs/policies/index.sig",
            "docs/policies/**/tests.yaml",
          ]
      - id: POL_02
        rule: "engine_version_pin mismatch => DENIED with reason_code"
        evidence: ["receipts/engine_pin_denied.json"]

required_artifacts:
  - "public_keys.json"
  - "receipts/"
  - "reports/"
  - "docs/KEY_ROTATION.md"
  - "docs/BRANCH_PROTECTION.md"
  - "docs/policies/index.json"
  - "docs/policies/index.sig"

decision:
  pass: "ABS_INDISPENSABLE_READY"
  fail: "ABS_NOT_INDISPENSABLE_YET"
  rule: "ANY gate failure OR missing artifact => FAIL_CLOSED"

next_actions_on_fail:
  - "Ship buyer-proof report kit before adding new policies."
  - "Ship key rotation+revocation before expanding domains."
  - "Fix distribution/TTFV before adding backend features."
