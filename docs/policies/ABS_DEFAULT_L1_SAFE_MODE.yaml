id: ABS_DEFAULT_L1_SAFE_MODE
version: 1.0.0
description: "Default Safe Mode Policy for New Projects (L1)"
gates:
  - id: GATE_ALLOW_echo
    description: "Allows echo commands (Legacy)"
    pass_conditions: []
    checks: []

  # 1. SAFE_SHELL_L1
  - id: SAFE_SHELL_L1
    description: "Blocks dangerous shell commands"
    checks:
      - id: block_rm_rf_root
        rule: "payload.arguments.command not_regex_match 'rm\\s+-[a-zA-Z]*r[a-zA-Z]*f?\\s+/'"
      - id: block_mkfs
        rule: "payload.arguments.command not_regex_match 'mkfs'"
      - id: block_dd
        rule: "payload.arguments.command not_regex_match 'dd\\s+if='"
      - id: sudo_warning
        rule: "payload.arguments.command not_regex_match 'sudo'"

  # 2. SAFE_GIT_L1
  - id: SAFE_GIT_L1
    description: "Blocks dangerous git operations"
    checks:
      # If it's a git command (simplified check via tool name or command arg)
      - id: block_git_force_push
        rule: "payload.arguments.command not_regex_match 'git\\s+push.*--force'"

  # 3. SAFE_NODE_NPM_L1
  - id: SAFE_NODE_NPM_L1
    description: "Blocks dangerous npm operations"
    checks:
      - id: block_npm_publish
        rule: "payload.arguments.command not_regex_match 'npm\\s+publish'"

  # 4. SAFE_PYTHON_PIP_L1
  # Allow pip install (implied by absence of block), blocks nothing specific yet for L1

  # 5. SAFE_DOCKER_L1
  - id: SAFE_DOCKER_L1
    description: "Blocks dangerous docker operations"
    checks:
      - id: block_docker_prune
        rule: "payload.arguments.command not_regex_match 'docker\\s+system\\s+prune'"
      - id: block_docker_root_mount
        rule: "payload.arguments.command not_regex_match '-v\\s+/:/'"

  # 6. SAFE_SECRETS_L1
  - id: SAFE_SECRETS_L1
    description: "Prevents leaking secrets in arguments"
    checks:
      - id: block_private_keys
        rule: "payload.arguments.command not_regex_match '-----BEGIN\\s+OPENSSH\\s+PRIVATE\\s+KEY-----'"
      - id: block_aws_keys
        rule: "payload.arguments.command not_regex_match 'AKIA[0-9A-Z]{16}'"

  # 7. SAFE_HTTP_FETCH_L1
  - id: SAFE_HTTP_FETCH_L1
    description: "Blocks access to local metadata services"
    checks:
      # Assuming a 'fetch' tool or curl command
      - id: block_aws_metadata
        rule: "payload.arguments.url not_regex_match '169\\.254\\.169\\.254'"

  # 8. SAFE_FILESYSTEM_L1
  - id: SAFE_FILESYSTEM_L1
    description: "Protects critical system directories"
    checks:
      # Generic check for file paths in arguments
      - id: protect_etc
        rule: "payload.arguments.path not_regex_match '^/etc'"
      - id: protect_var
        rule: "payload.arguments.path not_regex_match '^/var'"
      - id: protect_ssh
        rule: "payload.arguments.path not_regex_match '/\\.ssh/'"
      - id: protect_aws
        rule: "payload.arguments.path not_regex_match '/\\.aws/'"

  # 9. SAFE_MCP_TOOLS_L1
  - id: SAFE_MCP_TOOLS_L1
    description: "Restricts write_file tool"
    checks:
      # If tool_name is write_file, path must not be critical (redundant with above but specific)
      # Rule syntax limitation: we can't easily do "IF tool==write_file THEN check path".
      # For V1, we rely on the generic filesystem checks above applying to ALL tools/args.
      - id: block_write_root
        rule: "payload.arguments.path not_regex_match '^/[^/]+$'" # Block writing to /root_file

  # 10. SAFE_IDE_ACTIONS_L1
  # Rate limiting requires state/history (not implemented in stateless logic yet).
  # Placeholder for V1.
  - id: SAFE_IDE_ACTIONS_L1
    description: "Rate limiting placeholder"
    checks: []

thresholds: {}
evidence_requirements: {}
