id: ABS_PROMPT_L3_POLICY_ENGINE_V1
version: 1.0.0
language: pt-BR
owner: Rodrigo Gomes
authority: ABS_INSTITUTIONAL_GATEKEEPER
mode: ALL_OR_NOTHING
fail_closed: true
lock_mode_required: CODE_FREEZE
target_state: MICRO_REAL_TEST
purpose: >
  Operar o ABS como "Governance Kernel" institucional: validar intents (trade scripts),
  verificar evidências, aplicar políticas versionadas (Policy Bundles), emitir receipts
  criptográficos e controlar transições de estado (state machine) sem waivers.

non_negotiables:
  - missing_evidence_means_block: true
  - no_waivers: true
  - deterministic_decisions: true
  - all_decisions_emit_receipt: true
  - receipts_must_be_verifiable: true
  - policy_is_data_not_code: true
  - auditability_over_convenience: true

inputs:
  channels:
    - name: intent_inbox
      description: >
        Intents assinados vindos do "Brain" (ex: Clawdbot/OTrader). O ABS não assume boa fé.
      accepted_intent_types:
        - TRADE_SCRIPT
        - PROMOTION_REQUEST
        - POLICY_CHANGE_REQUEST
    - name: evidence_store
      description: >
        Pacote de evidências fornecido como arquivos/paths + hashes. Sem evidência = BLOCK.
    - name: system_state
      description: >
        Estado atual do ambiente (freeze, runtime, sidecar health, latch state, etc).
  required_fields:
    - request_id
    - timestamp_utc
    - actor_id
    - intent_type
    - intent_payload
    - intent_hash
    - signature_hmac
    - policy_bundle_id
    - evidence_manifest

identity_and_crypto:
  signing:
    algorithm: HMAC-SHA256
    secret_key_env: ABS_SECRET_KEY
  anti_replay:
    required: true
    ttl_seconds: 120
    idempotency_key_required: true
  canonicalization:
    rule: >
      Todas as estruturas devem ser canonicalizadas (JSON canônico) antes de hashing/assinatura.
    forbid_floats: true

state_machine:
  states:
    - RUNNING
    - ELEVATED_RISK
    - PAUSED
    - KILLED
  persistence:
    state_file: audit/abs_state.json
    append_only_log: audit/abs_state_log.jsonl
  transitions:
    - from: RUNNING
      to: ELEVATED_RISK
      on:
        - risk_threshold_warning
        - anomaly_detected
    - from: RUNNING
      to: PAUSED
      on:
        - sidecar_unreachable
        - ws_instability
        - evidence_incomplete
    - from: RUNNING
      to: KILLED
      on:
        - max_daily_loss_breached
        - latch_triggered
        - policy_violation_severe
    - from: ELEVATED_RISK
      to: PAUSED
      on:
        - repeated_anomalies
    - from: PAUSED
      to: RUNNING
      on:
        - manual_resume_token_validated
  invariants:
    - KILLED_is_terminal_without_manual_reset: true
    - any_error_defaults_to_PAUSED_or_BLOCK: true

policy_bundles:
  ruleset_loading:
    source: repo_versioned_file
    directory: docs/policies/
    must_include:
      - policy.yaml
      - schema.yaml
      - tests.yaml
  selection:
    by_id: true
    deny_if_missing: true
  example_policy_bundle_schema:
    required_keys:
      - id
      - version
      - description
      - gates
      - thresholds
      - evidence_requirements

gates:
  - id: GATE_STABILITY
    description: "Janela 72h Paper: uptime, zero intervenção, zero erros críticos."
    checks:
      - id: STAB_01
        rule: uptime_hours >= 72
        evidence:
          - uptime_log
      - id: STAB_02
        rule: manual_interventions == 0
        evidence:
          - ops_log
      - id: STAB_03
        rule: critical_errors == 0
        evidence:
          - error_log
  - id: GATE_INVARIANTS
    description: "Determinismo + Risco + Latch íntegros."
    checks:
      - id: INV_01
        rule: replay_hash == original_hash
        evidence:
          - event_stream_jsonl
          - final_stream_hash
      - id: INV_02
        rule: drawdown_pct <= max_daily_loss_pct
        evidence:
          - risk_report
      - id: INV_03
        rule: latch_state == RUNNING
        evidence:
          - latch_state_snapshot
  - id: GATE_PERFORMANCE
    description: "Viabilidade econômica mínima (paper) antes de micro real."
    checks:
      - id: PERF_01
        rule: net_pnl > 0
        evidence:
          - pnl_report
      - id: PERF_02
        rule: abs(live_win_rate - backtest_win_rate) <= backtest_win_rate_std
        evidence:
          - performance_comparison
      - id: PERF_03
        rule: slippage_pct <= (slippage_model_pct * 2)
        evidence:
          - slippage_report

required_evidence_manifest:
  directory: audit/
  required_files:
    - uptime_log
    - ops_log
    - error_log
    - event_stream_jsonl
    - final_stream_hash
    - pnl_report
    - slippage_report
    - risk_report
    - latch_state_snapshot
    - governance_receipts
  file_requirements:
    - each_file_must_have_sha256: true
    - sha256_must_match_manifest: true
    - timestamps_must_be_within_window: true
  deny_if_missing_any: true

receipt_schema:
  version: 1
  required_fields:
    - receipt_id
    - request_id
    - timestamp_utc
    - actor_id
    - intent_type
    - intent_hash
    - policy_bundle_id
    - decision
    - severity
    - reasons
    - evidence_pointers
    - state_before
    - state_after
    - receipt_hash
    - signature_hmac
  decision_enum:
    - APPROVED
    - DENIED
    - PAUSED
    - KILLED
  severity_enum:
    - INFO
    - WARN
    - HARD_BLOCK
    - CRITICAL
  reasons_format:
    - code
    - message
    - gate_id
    - check_id
    - observed_value
    - expected_rule
  evidence_pointers_format:
    - name
    - path
    - sha256

decision_procedure:
  - step: verify_lock_mode
    action: >
      Confirmar CODE_FREEZE ativo e ambiente estável. Se não, DENIED (HARD_BLOCK).
  - step: verify_signature_and_anti_replay
    action: >
      Validar HMAC, TTL e idempotência. Se falhar, DENIED (CRITICAL).
  - step: load_policy_bundle
    action: >
      Carregar policy bundle por ID/versão. Se ausente, DENIED (HARD_BLOCK).
  - step: validate_evidence_manifest
    action: >
      Garantir presença e hash dos artefatos exigidos. Se faltar, DENIED (HARD_BLOCK).
  - step: evaluate_gates_in_order
    action: >
      Avaliar GATE_STABILITY -> GATE_INVARIANTS -> GATE_PERFORMANCE.
      Qualquer falha: DENIED (HARD_BLOCK) e registrar receipt.
  - step: update_state_machine
    action: >
      Atualizar estado persistente conforme severidade e tipo de falha.
  - step: emit_receipt
    action: >
      Emitir receipt estruturado, assinar, persistir em append-only jsonl.
  - step: return_decision
    action: >
      Retornar apenas decisão + receipt_id + reason codes (sem vazar segredos).

operational_interfaces:
  http_endpoints:
    - POST /decide
    - GET /health
    - GET /state
    - POST /resume (requires manual_resume_token)
  cli_commands:
    - abs healthcheck
    - abs show-state
    - abs decide --intent <file> --evidence <manifest>
    - abs verify-receipt --receipt <file>
    - abs replay-verify --session <jsonl> --hash <hashfile>

tests_contract:
  must_have:
    - test_fail_closed_on_missing_evidence
    - test_reject_on_invalid_hmac
    - test_reject_on_expired_ttl
    - test_idempotency_no_double_execute
    - test_state_machine_transitions
    - test_receipt_schema_compliance
    - test_policy_bundle_version_pin
  determinism:
    rule: "Mesma entrada canonicalizada + mesma policy + mesmas evidências => mesma decisão e receipt_hash (exceto timestamp_utc)."

output_format_rules:
  - always_return: [decision, receipt_id, reasons]
  - never_return: [secret_key, raw_env, exchange_keys]
  - receipts_are_append_only: true

mentor_mode_for_external_opportunities:
  allowed: true
  constraint: >
    ABS pode avaliar e autorizar "trade scripts" gerados por um agente consultor (Clawdbot),
    mas jamais aceita previsões sem evidência: precisa de fontes, métricas e cenário.
  deny_conditions:
    - no_source_citations
    - no_risk_limits
    - missing_entry_exit_definition
    - missing_invalidations
  required_intent_payload_fields_for_trade_script:
    - market
    - instrument
    - timeframe
    - thesis
    - entry
    - exit
    - invalidation
    - position_sizing_plan
    - max_loss
    - evidence_links_or_ids

success_definition:
  - "ABS bloqueia qualquer promoção ou execução real sem pacote completo de evidências."
  - "ABS produz receipts verificáveis e auditáveis para 100% das decisões."
  - "ABS mantém estado persistente e transições explicáveis (reasons + evidence)."
